spring.application.name=financas

# Lê segredos locais do .env (fora do Git); "optional" evita erro se o arquivo não existir
spring.config.import=optional:file:.env[.properties]

# DataSource PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/financas
# Credenciais vêm do .env (ou de variáveis de ambiente) — mesmas usadas pelo docker-compose
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Spring Security Default User
spring.security.user.name=admin
spring.security.user.password=admin

# JWT
financas.app.jwtSecret=${JWT_SECRET}
financas.app.jwtExpirationMs=86400000
